<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#334155"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#334155;stroke-width:2}.group{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.title{font-size:20px;font-weight:700;fill:#0f172a}.label{font-size:16px;font-weight:650;fill:#0f172a}.small{font-size:13px;fill:#475569}.line{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="650" fill="#fff"/>
  <text x="40" y="42" class="title">Geuneul production architecture · AWS → OCI migration complete</text>

  <rect x="40" y="95" width="210" height="150" rx="14" class="group"/>
  <text x="60" y="126" class="label">Browser · PWA</text>
  <rect x="65" y="150" width="160" height="65" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="145" y="178" text-anchor="middle" class="label">Next.js UI</text>
  <text x="145" y="199" text-anchor="middle" class="small">same-origin /api/*</text>

  <rect x="310" y="95" width="220" height="150" rx="14" class="group"/>
  <text x="330" y="126" class="label">Vercel</text>
  <rect x="335" y="150" width="170" height="65" rx="10" fill="#f1f5f9" stroke="#0f172a" stroke-width="2"/>
  <text x="420" y="178" text-anchor="middle" class="label">Next Route BFF</text>
  <text x="420" y="199" text-anchor="middle" class="small">server-only OCI origin</text>

  <rect x="590" y="70" width="570" height="500" rx="18" fill="#fff7ed" stroke="#f97316" stroke-width="2.5"/>
  <text x="615" y="108" class="title">OCI · Chuncheon · ARM64</text>
  <rect x="620" y="135" width="510" height="75" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="875" y="165" text-anchor="middle" class="label">Existing public edge · Caddy HTTPS/SNI</text>
  <text x="875" y="188" text-anchor="middle" class="small">API route + credential-free Object Storage upload gateway</text>

  <rect x="620" y="240" width="510" height="205" rx="14" class="group"/>
  <text x="645" y="272" class="label">A1 Flex 2 OCPU · 12GB · rootless cgroup 0.75 CPU / 3GB</text>
  <rect x="645" y="300" width="145" height="105" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="718" y="333" text-anchor="middle" class="label">Spring Boot</text>
  <text x="718" y="356" text-anchor="middle" class="small">Java 21 · API</text>
  <text x="718" y="378" text-anchor="middle" class="small">0.55 CPU · 1GiB</text>
  <rect x="805" y="300" width="180" height="105" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="895" y="333" text-anchor="middle" class="label">PostgreSQL 16</text>
  <text x="895" y="356" text-anchor="middle" class="small">PostGIS 3.6 · SRID 4326</text>
  <text x="895" y="378" text-anchor="middle" class="small">0.35 CPU · 1.25GiB</text>
  <rect x="1000" y="300" width="105" height="105" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="1053" y="333" text-anchor="middle" class="label">Redis 7.4</text>
  <text x="1053" y="356" text-anchor="middle" class="small">cache · rate</text>
  <text x="1053" y="378" text-anchor="middle" class="small">192MiB</text>

  <rect x="620" y="475" width="330" height="68" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="785" y="503" text-anchor="middle" class="label">Private Object Storage</text>
  <text x="785" y="525" text-anchor="middle" class="small">versioned photos · verified 14-day DB backups</text>
  <rect x="970" y="475" width="160" height="68" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="1050" y="503" text-anchor="middle" class="label">systemd timers</text>
  <text x="1050" y="525" text-anchor="middle" class="small">backup · health</text>

  <rect x="40" y="310" width="490" height="175" rx="14" class="group"/>
  <text x="60" y="343" class="label">External APIs</text>
  <text x="70" y="382" class="small">Kakao geocoding · routes</text>
  <text x="70" y="414" class="small">KMA weather · public data</text>
  <text x="70" y="446" class="small">AI summary provider</text>
  <rect x="310" y="350" width="190" height="95" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="405" y="382" text-anchor="middle" class="label">GitHub Actions</text>
  <text x="405" y="405" text-anchor="middle" class="small">ARM64 build · tests</text>
  <text x="405" y="427" text-anchor="middle" class="small">restricted release gateway</text>

  <path d="M250 180H310" class="line"/>
  <path d="M530 180H620" class="line"/>
  <path d="M875 210V240" class="line"/>
  <path d="M790 352H805" class="line"/>
  <path d="M985 352H1000" class="line"/>
  <path d="M718 405V475" class="line"/>
  <path d="M1050 475V445" class="line"/>
  <path d="M500 397H645" class="line"/>
  <path d="M500 370Q560 300 645 330" class="line"/>

  <text x="40" y="615" class="small">AWS source: CloudFront → ALB → ECS Fargate 0.5 vCPU/1GB → RDS PostgreSQL 16 + ElastiCache Redis 7.1 + private S3. Data was verified before the AWS runtime was retired.</text>
</svg>
