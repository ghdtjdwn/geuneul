name: Deploy (OCI ARM64)

# Production releases are manual. "stage" transfers verified artifacts without
# changing services; the normal ongoing release path is "deploy". The separate
# start-data/activate bootstrap was used only for the completed first migration.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Transfer images only, or transfer and activate the release
        required: true
        default: stage
        type: choice
        options:
          - stage
          - deploy

permissions:
  contents: read

concurrency:
  group: deploy-oci-production
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize main branch dispatch
    runs-on: ubuntu-latest
    steps:
      - name: Require the main branch ref
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          if [[ "$DISPATCH_REF" != "refs/heads/main" ]]; then
            echo "::error::Production releases must be dispatched from refs/heads/main."
            exit 1
          fi

  test:
    name: Production test gate
    needs: authorize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c  # v6
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: 1.15.7
          terraform_wrapper: false
      - name: Backend gate
        working-directory: backend
        run: ./gradlew test jacocoTestCoverageVerification
      - name: Infrastructure gate
        run: |
          find infra/oci -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          GEUNEUL_CADDY_INTEGRATION=1 \
            python3 -m unittest discover -s infra/oci/tests -p 'test_*.py'
          terraform -chdir=infra/oci/terraform fmt -check
          terraform -chdir=infra/oci/terraform init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/oci/terraform validate

  deploy:
    name: ${{ inputs.operation }} OCI production release
    needs: [authorize, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Build verified ARM64 image archives
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          docker buildx build --platform linux/arm64 \
            --build-arg "APP_VERSION=$RELEASE_SHA" \
            --cache-from type=gha,scope=geuneul-backend-arm64 \
            --cache-to type=gha,mode=max,scope=geuneul-backend-arm64 \
            --tag "geuneul-backend:$RELEASE_SHA" \
            --output "type=docker,dest=${RUNNER_TEMP}/backend-image.tar" backend
          docker buildx build --platform linux/arm64 \
            --cache-from type=gha,scope=geuneul-postgis-arm64 \
            --cache-to type=gha,mode=max,scope=geuneul-postgis-arm64 \
            --tag geuneul-postgis:16.15-3.6.4 \
            --output "type=docker,dest=${RUNNER_TEMP}/postgis-image.tar" infra/oci/postgis
          docker load --input "${RUNNER_TEMP}/backend-image.tar" >/dev/null
          docker load --input "${RUNNER_TEMP}/postgis-image.tar" >/dev/null
          test "$(docker image inspect --format '{{.Architecture}}' "geuneul-backend:$RELEASE_SHA")" = arm64
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "geuneul-backend:$RELEASE_SHA")" = "$RELEASE_SHA"
          test "$(docker image inspect --format '{{.Architecture}}' geuneul-postgis:16.15-3.6.4)" = arm64
      - name: Assemble bounded release archive
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          release_directory="${RUNNER_TEMP}/release"
          archive="${RUNNER_TEMP}/geuneul-${RELEASE_SHA}.tar.gz"
          mkdir -p "$release_directory/infra/oci/scripts"
          install -m 0644 infra/oci/compose.production.yml "$release_directory/infra/oci/compose.production.yml"
          install -m 0755 infra/oci/scripts/*.sh "$release_directory/infra/oci/scripts/"
          install -m 0755 infra/oci/scripts/*.py "$release_directory/infra/oci/scripts/"
          install -m 0600 "${RUNNER_TEMP}/backend-image.tar" "$release_directory/backend-image.tar"
          install -m 0600 "${RUNNER_TEMP}/postgis-image.tar" "$release_directory/postgis-image.tar"
          backend_digest="$(sha256sum "$release_directory/backend-image.tar" | awk '{print $1}')"
          postgis_digest="$(sha256sum "$release_directory/postgis-image.tar" | awk '{print $1}')"
          printf '%s\n' \
            "source_sha=$RELEASE_SHA" \
            "backend_archive_sha256=$backend_digest" \
            "postgis_archive_sha256=$postgis_digest" \
            >"$release_directory/release-manifest"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C "$release_directory" -czf "$archive" \
            release-manifest backend-image.tar postgis-image.tar infra
          archive_size="$(stat -c '%s' "$archive")"
          test "$archive_size" -gt 0
          test "$archive_size" -le 536870912
          printf 'RELEASE_ARCHIVE=%s\n' "$archive" >>"$GITHUB_ENV"
          printf 'RELEASE_DIGEST=%s\n' "$(sha256sum "$archive" | awk '{print $1}')" >>"$GITHUB_ENV"
      - name: Transfer release through restricted SSH gateway
        env:
          DEPLOY_HOST: ${{ secrets.OCI_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.OCI_DEPLOY_USER }}
          DEPLOY_PRIVATE_KEY: ${{ secrets.OCI_DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.OCI_DEPLOY_HOST_KEY }}
          RELEASE_SHA: ${{ github.sha }}
          OPERATION: ${{ inputs.operation }}
        run: |
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          test -n "$DEPLOY_HOST"
          [[ "$DEPLOY_HOST_KEY" == "$DEPLOY_HOST "* ]]
          key_file="${RUNNER_TEMP}/deploy-key"
          known_hosts="${RUNNER_TEMP}/known-hosts"
          trap 'rm -f "$key_file" "$known_hosts"' EXIT
          install -m 0600 /dev/null "$key_file"
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" >"$key_file"
          install -m 0600 /dev/null "$known_hosts"
          printf '%s\n' "$DEPLOY_HOST_KEY" >"$known_hosts"
          ssh-keygen -l -f "$key_file" >/dev/null
          ssh-keygen -l -f "$known_hosts" >/dev/null
          ssh -T \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$known_hosts" \
            -i "$key_file" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "$OPERATION $RELEASE_SHA $RELEASE_DIGEST" <"$RELEASE_ARCHIVE"
          if [[ "$OPERATION" == "deploy" ]]; then
            current="$(ssh -T \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o "UserKnownHostsFile=$known_hosts" \
              -i "$key_file" \
              "$DEPLOY_USER@$DEPLOY_HOST" current)"
            test "$current" = "$RELEASE_SHA"
          fi
