name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  backend:
    name: Backend (Gradle, JDK 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287  # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92  # v6
      - name: Test + coverage
        # Testcontainers(PostGIS)는 ubuntu-latest의 Docker 데몬 위에서 실행된다.
        # Docker 없는 로컬에서는 self-skip(disabledWithoutDocker). 커버리지 floor 값의 단일 출처는
        # build.gradle의 jacocoTestCoverageVerification(현재 0.70) — 그 아래로 떨어지면 빌드 실패.
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 7
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: jacoco-coverage-report
          path: backend/build/reports/jacoco/test/html
          retention-days: 7

  oci-infra:
    name: OCI migration (ARM64, Terraform, scripts)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0
      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85  # v4.0.0
        with:
          terraform_version: 1.15.7
          terraform_wrapper: false
      - name: Validate Terraform
        run: |
          terraform -chdir=infra/oci/terraform fmt -check
          terraform -chdir=infra/oci/terraform init -backend=false -input=false
          terraform -chdir=infra/oci/terraform validate
      - name: Validate migration scripts
        run: |
          find infra/oci -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          python3 -m unittest discover -s infra/oci/tests -p 'test_*.py'
      - name: Validate production Compose contract
        run: |
          env_file="$(mktemp)"
          trap 'rm -f "$env_file"' EXIT
          chmod 0600 "$env_file"
          cat >"$env_file" <<'EOF'
          COMPOSE_PROJECT_NAME=geuneul
          GEUNEUL_BIND_ADDRESS=10.0.0.10
          GEUNEUL_APP_PORT=13880
          POSTGRES_ADMIN_PASSWORD=ci-postgres-admin-password-00000000
          DB_PASSWORD=ci-database-password-00000000000000
          JWT_SECRET=ci-jwt-secret-00000000000000000000
          GEUNEUL_PROXY_SECRET=ci-proxy-secret-00000000000000000
          S3_BUCKET_NAME=geuneul-ci-photos
          S3_REGION=ap-seoul-1
          S3_ENDPOINT=https://example.compat.objectstorage.ap-seoul-1.oraclecloud.com
          S3_BROWSER_UPLOAD_PROXY_BASE_URL=https://api.example.com/object-storage
          AWS_ACCESS_KEY_ID=ci-access-key
          AWS_SECRET_ACCESS_KEY=ci-object-storage-secret-000000000
          BACKUP_BUCKET_NAME=geuneul-ci-backups
          BACKUP_RETENTION_DAYS=14
          LOCAL_BACKUP_RETENTION_DAYS=3
          BACKUP_AWS_ACCESS_KEY_ID=ci-backup-access-key
          BACKUP_AWS_SECRET_ACCESS_KEY=ci-backup-object-storage-secret-00000
          EOF
          GEUNEUL_RELEASE_SHA=0123456789abcdef0123456789abcdef01234567 \
            infra/oci/scripts/validate-runtime.sh "$env_file"
      - name: Build ARM64 images
        run: |
          docker buildx build --platform linux/arm64 --load \
            --tag geuneul-postgis:arm64-ci infra/oci/postgis
          docker buildx build --platform linux/arm64 --load \
            --tag geuneul-backend:arm64-ci backend
          test "$(docker image inspect --format '{{.Architecture}}' geuneul-postgis:arm64-ci)" = arm64
          test "$(docker image inspect --format '{{.Architecture}}' geuneul-backend:arm64-ci)" = arm64
      - name: Smoke-test ARM64 PostGIS image
        run: |
          container=geuneul-postgis-arm64-ci
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker run --detach --name "$container" --platform linux/arm64 \
            --env POSTGRES_DB=geuneul \
            --env POSTGRES_USER=geuneul_admin \
            --env POSTGRES_PASSWORD=ci-postgres-admin-password \
            --env GEUNEUL_DB_PASSWORD=ci-database-password \
            geuneul-postgis:arm64-ci
          for attempt in $(seq 1 60); do
            if docker exec "$container" pg_isready -U geuneul_admin -d geuneul >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs "$container"
              exit 1
            fi
            sleep 2
          done
          docker exec "$container" psql -U geuneul_admin -d geuneul -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_extension WHERE extname = 'postgis') THEN
              RAISE EXCEPTION 'PostGIS extension is missing';
            END IF;
            IF (SELECT rolsuper FROM pg_roles WHERE rolname = 'geuneul_app') THEN
              RAISE EXCEPTION 'geuneul_app must not be a superuser';
            END IF;
          END
          $$;
          CREATE TEMP TABLE ci_geometry (point geometry(Point, 4326));
          INSERT INTO ci_geometry VALUES (ST_SetSRID(ST_MakePoint(127.0, 37.5), 4326));
          SELECT ST_SRID(point) FROM ci_geometry;
          SQL

  # 워크플로우 규칙 D("커밋 전 비밀 유출 스캔") + docs/SPEC.md §7 스택의 gitleaks를 CI로 강제.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0   # 전체 히스토리 스캔(과거 커밋에 새어든 비밀도 탐지)
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # v2는 PR 스캔에 필수(자동 발급 토큰)
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
