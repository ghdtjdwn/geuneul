allowBuilds:
  unrs-resolver: true

# pnpm 11: 네이티브 빌드 스크립트 허용 목록(공급망 안전 — 명시한 것만 빌드).
# sharp = next/image 최적화, unrs-resolver = eslint import 해석, oxide = tailwind v4 엔진.
onlyBuiltDependencies:
  - sharp
  - unrs-resolver
  - "@tailwindcss/oxide"

# Next.js 의 전이 의존성까지 최소 보안 버전으로 수렴시킨다.
# PostCSS 8 API 호환 버전으로 해석해 GHSA-qx2v-qp2m-jg93을 제거한다.
overrides:
  baseline-browser-mapping: ">=2.11.0"
  brace-expansion: 5.0.12
  browserslist: 4.28.7
  glob: ">=14.0.2"
  js-yaml: 4.3.2
  "minimatch@>=7": ">=11.0.1"
  nanoid: 3.3.18
  postcss: 8.5.23
  sharp: 0.35.5
  source-map-js: ">=1.2.2"
  zod: ">=4.6.6"

patchedDependencies:
  minimatch@3.1.5: patches/minimatch@3.1.5.patch
